name: typecho-mysql57

services:
  typecho:
    image: joyqi/typecho:1.3.0-php8.2-apache
    container_name: typecho-mysql57
    # 不直接暴露宿主机端口，由 Caddy 反向代理统一提供 80/443 访问
    expose:
      - "80"
    environment:
      TIMEZONE: Asia/Shanghai
      # 站点 URL：与 hosts 中配置的本地域名保持一致（HTTPS 由 Caddy 提供）
      TYPECHO_SITE_URL: https://jj.test
      # 首次启动自动执行安装脚本；安装完成后改回 0
      TYPECHO_INSTALL: 1
      # 数据库配置（对应下方 mysql 服务）
      TYPECHO_DB_ADAPTER: Pdo_Mysql
      TYPECHO_DB_HOST: mysql
      TYPECHO_DB_PORT: 3306
      TYPECHO_DB_USER: root
      TYPECHO_DB_PASSWORD: root
      TYPECHO_DB_DATABASE: typecho
      TYPECHO_DB_PREFIX: typecho_
      TYPECHO_DB_ENGINE: InnoDB
      TYPECHO_DB_CHARSET: utf8mb4
      # 数据库已有表时跳过初始化，避免覆盖数据
      TYPECHO_DB_NEXT: keep
      # 自动安装时创建的管理员账号（仅 TYPECHO_INSTALL=1 时生效）
      TYPECHO_USER_NAME: admin
      TYPECHO_USER_PASSWORD: admin123
      TYPECHO_USER_MAIL: admin@jj.test
    volumes:
      # 主题目录：仓库根目录下的 dist/ 构建产物 → 容器内主题目录
      # 注意：需先执行 pnpm build（或 pnpm dev 常驻 watch）生成 dist/，否则主题为空
      - ../dist:/app/usr/themes/Typecho_Theme_JJ
      # 插件目录：本地 plugins/ → 容器内插件目录
      - ./plugins:/app/usr/plugins
      # 配置文件（首次安装后用 docker compose cp 导出到本地，见 README）
      - ./config.inc.php:/app/config.inc.php
    depends_on:
      - mysql
    restart: unless-stopped

  mysql:
    image: mysql:5.7
    container_name: typecho-mysql57-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: typecho
    volumes:
      # 数据库数据持久化
      - ./mysql-data:/var/lib/mysql
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: typecho-mysql57-pma
    ports:
      - "8080:80" # Web 访问端口
    environment:
      # 通过 Docker 内部网络连接当前运行的 MySQL 实例（5.7 或 8.0）
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
      PMA_ABSOLUTE_URI: http://localhost:8080/
    depends_on:
      - mysql
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: typecho-mysql57-caddy
    ports:
      - "80:80" # HTTP（Caddy 默认重定向到 HTTPS）
      - "443:443" # HTTPS（mkcert 本地受信证书）
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - typecho
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
